<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistant Rédactionnel - Studio du Cap Brun</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body data-theme="dark">
    <!-- Bouton de changement de thème -->
    <div class="theme-toggle" onclick="app.toggleTheme()">
        <i class="fas fa-sun"></i>
    </div>

    <div class="main-container">
        <!-- Informations du Projet -->
        <div class="section fade-in">
            <h3 class="section-title">
                <i class="fas fa-info-circle"></i>
                Informations du Projet
            </h3>
            <div class="form-group">
                <label for="projectTitle">Titre du projet</label>
                <input type="text" id="projectTitle" placeholder="Nom de votre projet">
            </div>
            <div class="form-group">
                <label for="targetAudience">Public cible</label>
                <input type="text" id="targetAudience" placeholder="Votre audience">
            </div>
            <div class="form-group">
                <label for="projectDescription">Description du projet</label>
                <textarea id="projectDescription" placeholder="Décrivez votre projet en détail..."></textarea>
            </div>
        </div>

        <!-- Sélection de l'IA -->
        <div class="section fade-in">
            <h3 class="section-title">
                <i class="fas fa-robot"></i>
                Sélection de l'IA
            </h3>
            <div class="ai-selection">
                <div class="ai-btn" data-ai="claude">
                    <i class="fas fa-brain"></i>
                    <div>Claude</div>
                </div>
                <div class="ai-btn" data-ai="gpt4">
                    <i class="fas fa-microchip"></i>
                    <div>GPT-4</div>
                </div>
                <div class="ai-btn" data-ai="gemini">
                    <i class="fas fa-gem"></i>
                    <div>Gemini</div>
                </div>
            </div>
        </div>

        <!-- Zone de Collecte -->
        <div class="section fade-in">
            <h3 class="section-title">
                <i class="fas fa-cloud-upload-alt"></i>
                Zone de Collecte
            </h3>
            <div class="form-group">
                <label for="contentInput">Contenu à traiter</label>
                <textarea id="contentInput" placeholder="Collez votre contenu ici..."></textarea>
            </div>
        </div>

        <!-- Bouton de génération -->
        <button class="generate-btn btn-primary" onclick="app.generateContent()">
            <i class="fas fa-magic"></i>
            Générer le contenu
        </button>

        <!-- Résultats -->
        <div class="section fade-in">
            <h3 class="section-title">
                <i class="fas fa-cog"></i>
                Résultats
            </h3>
            <div class="result-area" id="resultArea">
                <p>Aucun résultat disponible. Lancez un traitement pour voir les résultats ici.</p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
