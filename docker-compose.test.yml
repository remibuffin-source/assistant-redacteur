version: '3.8'

services:
  # MongoDB pour les tests
  mongodb-test:
    image: mongo:7.0
    container_name: assistant-redacteur-mongo-test
    restart: no
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: testpassword123
      MONGO_INITDB_DATABASE: assistant-redacteur-test
    ports:
      - "27018:27017"  # Port différent pour éviter les conflits
    volumes:
      - mongodb_test_data:/data/db
    networks:
      - assistant-redacteur-test-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Redis pour les tests
  redis-test:
    image: redis:7.2-alpine
    container_name: assistant-redacteur-redis-test
    restart: no
    command: redis-server --requirepass testpassword456
    ports:
      - "6380:6379"  # Port différent pour éviter les conflits
    volumes:
      - redis_test_data:/data
    networks:
      - assistant-redacteur-test-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Backend pour les tests
  backend-test:
    build:
      context: ./backend
      dockerfile: Dockerfile.test
    container_name: assistant-redacteur-backend-test
    restart: no
    environment:
      NODE_ENV: test
      PORT: 4001
      MONGODB_URI: mongodb://admin:testpassword123@mongodb-test:27017/assistant-redacteur-test?authSource=admin
      REDIS_URL: redis://:testpassword456@redis-test:6379
      JWT_SECRET: test-jwt-secret-key-for-testing
      JWT_REFRESH_SECRET: test-refresh-secret-key-for-testing
    ports:
      - "4001:4001"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      mongodb-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    networks:
      - assistant-redacteur-test-network
    command: npm run test:integration

volumes:
  mongodb_test_data:
    driver: local
  redis_test_data:
    driver: local

networks:
  assistant-redacteur-test-network:
    driver: bridge
