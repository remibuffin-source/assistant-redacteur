<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test API Qwen3</title>
</head>
<body>
    <h1>Test API Qwen3</h1>
    <button id="testBtn">Tester Qwen3</button>
    <pre id="result"></pre>

    <script>
        document.getElementById('testBtn').addEventListener('click', async () => {
            const resultEl = document.getElementById('result');
            resultEl.textContent = 'Test en cours...';

            try {
                const token = localStorage.getItem('token');
                
                if (!token) {
                    resultEl.textContent = 'Erreur: Pas de token. Connectez-vous d\'abord sur le site.';
                    return;
                }

                console.log('Token:', token.substring(0, 20) + '...');

                const response = await fetch('https://api.assistant-redacteur.fr/ai/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        service: 'qwen3',
                        model: 'qwen-turbo',
                        messages: [
                            { role: 'user', content: 'Dis bonjour en français' }
                        ],
                        maxTokens: 100,
                        temperature: 0.7
                    })
                });

                console.log('Status:', response.status);
                console.log('OK:', response.ok);

                const result = await response.json();
                console.log('Result:', result);

                resultEl.textContent = JSON.stringify(result, null, 2);

            } catch (error) {
                console.error('Erreur:', error);
                resultEl.textContent = 'Erreur: ' + error.message + '\n\n' + error.stack;
            }
        });
    </script>
</body>
</html>
