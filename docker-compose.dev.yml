version: '3.8'

services:
  # Base de données MongoDB pour le développement
  mongodb-dev:
    image: mongo:7.0
    container_name: assistant-redacteur-mongo-dev
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: devpassword123
      MONGO_INITDB_DATABASE: assistant-redacteur-dev
    ports:
      - "27017:27017"
    volumes:
      - mongodb_dev_data:/data/db
    networks:
      - assistant-redacteur-dev-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Cache Redis pour le développement
  redis-dev:
    image: redis:7.2-alpine
    container_name: assistant-redacteur-redis-dev
    restart: unless-stopped
    command: redis-server --requirepass devpassword456
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    networks:
      - assistant-redacteur-dev-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Backend en mode développement avec hot reload
  backend-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: assistant-redacteur-backend-dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 4000
      MONGODB_URI: mongodb://admin:devpassword123@mongodb-dev:27017/assistant-redacteur-dev?authSource=admin
      REDIS_URL: redis://:devpassword456@redis-dev:6379
      FRONTEND_URL: http://localhost:3003
      JWT_SECRET: dev-jwt-secret-key-change-in-production
      JWT_REFRESH_SECRET: dev-refresh-secret-key
      LOG_LEVEL: debug
    ports:
      - "4000:4000"
      - "4001:4001"  # Socket.IO
    volumes:
      - ./backend:/app
      - /app/node_modules  # Ne pas écraser node_modules du conteneur
      - ./backend/logs:/app/logs
    depends_on:
      mongodb-dev:
        condition: service_healthy
      redis-dev:
        condition: service_healthy
    networks:
      - assistant-redacteur-dev-network
    command: npm run dev

volumes:
  mongodb_dev_data:
    driver: local
  redis_dev_data:
    driver: local

networks:
  assistant-redacteur-dev-network:
    driver: bridge
