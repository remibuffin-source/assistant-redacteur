version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "🚀 Démarrage du build - Assistant Rédactionnel"
        - cd react-app
        - echo "🗑️ Nettoyage du cache npm..."
        - rm -rf node_modules package-lock.json
        - npm cache clean --force
        - echo "📦 Installation des dépendances..."
        - npm install --legacy-peer-deps --platform=linux --arch=x64
        - echo "✅ Dépendances installées"
    build:
      commands:
        - echo "🔨 Build de l'application..."
        - npm run build
        - echo "✅ Build terminé"
        - ls -la dist
  artifacts:
    baseDirectory: react-app/dist
    files:
      - '**/*'
  cache:
    paths: []
  customHeaders:
    - pattern: '**/*'
      headers:
        - key: 'Strict-Transport-Security'
          value: 'max-age=31536000; includeSubDomains'
        - key: 'X-Frame-Options'
          value: 'SAMEORIGIN'
        - key: 'X-Content-Type-Options'
          value: 'nosniff'
        - key: 'X-XSS-Protection'
          value: '1; mode=block'
        - key: 'Referrer-Policy'
          value: 'strict-origin-when-cross-origin'